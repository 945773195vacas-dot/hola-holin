<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap de Aprendizaje: Quechua Central</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'quechua-emerald': '#064e3b',
                        'quechua-green': '#047857',
                        'quechua-mint': '#10b981',
                        'quechua-light': '#ecfdf5',
                        'quechua-accent': '#059669',
                        'quechua-dark': '#022c22'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #047857; border-radius: 8px; }
        .pattern-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#a7f3d0 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pattern-bg min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-emerald-950 via-emerald-900 to-emerald-800 text-white shadow-lg border-b-4 border-emerald-500 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-50 text-emerald-900 p-2.5 rounded-xl shadow-md font-bold text-2xl border border-emerald-300">
                    <i data-lucide="book-open-check"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2">
                        CHAWPIN QICHWA <span class="bg-emerald-500 text-emerald-950 text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">Vocabulario Pedagógico</span>
                    </h1>
                    <p class="text-xs sm:text-sm text-emerald-100">Ruta de Aprendizaje Interactiva</p>
                </div>
            </div>

            <!-- Global Progress Card -->
            <div class="bg-emerald-900/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-emerald-700/60 flex items-center gap-4 w-full md:w-auto">
                <div class="flex-1 md:w-56">
                    <div class="flex justify-between text-xs font-bold mb-1.5 text-emerald-100">
                        <span>Progreso de Subtemas</span>
                        <span id="progress-text">0 / 0 Subtemas</span>
                    </div>
                    <div class="w-full bg-emerald-950/80 rounded-full h-3 overflow-hidden border border-emerald-700/50">
                        <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-3 rounded-full transition-all duration-500 w-0"></div>
                    </div>
                </div>
                <button onclick="resetProgress()" title="Reiniciar progreso" class="text-emerald-200 hover:text-white transition-colors p-1.5 hover:bg-emerald-800 rounded-lg">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

        <!-- Controls Section -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="filter-buttons">
                <button onclick="filterPath('all')" class="filter-btn active-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-700 text-white shadow-md">Todos los Módulos</button>
                <button onclick="filterPath('fundamentos')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-50 text-emerald-800 hover:bg-emerald-100">Fundamentos & Fonética</button>
                <button onclick="filterPath('comunicacion')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-50 text-emerald-800 hover:bg-emerald-100">Comunicación (Rimana)</button>
                <button onclick="filterPath('matematica')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-50 text-emerald-800 hover:bg-emerald-100">Matemática (Yupana)</button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-600"></i>
                <input type="text" id="search-input" placeholder="Buscar concepto..." oninput="handleSearch()" class="w-full pl-9 pr-4 py-2 rounded-xl border border-emerald-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition-all">
            </div>
        </div>

        <!-- Timeline Container -->
        <div class="relative pl-4 sm:pl-8 border-l-4 border-emerald-300 space-y-10 ml-2 sm:ml-6" id="roadmap-container"></div>

    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[92vh] overflow-hidden shadow-2xl flex flex-col border border-emerald-200">
            <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white p-6 relative">
                <button onclick="closeModal()" class="absolute right-4 top-4 bg-emerald-950/40 hover:bg-emerald-950/70 text-white p-2 rounded-full">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <span id="modal-category" class="bg-emerald-400 text-emerald-950 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Categoría</span>
                <h3 id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-white mt-2">Título del Tema</h3>
                <p id="modal-subtitle" class="text-emerald-100 text-sm mt-1">Subtítulo explicativo</p>
            </div>

            <div class="p-6 overflow-y-auto space-y-6 custom-scrollbar flex-1 bg-slate-50/50">
                <div class="bg-emerald-50/80 p-4 rounded-2xl border border-emerald-100">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 text-emerald-600"></i> Descripción
                    </h4>
                    <p id="modal-description" class="text-slate-700 leading-relaxed text-xs sm:text-sm"></p>
                </div>

                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-950 mb-3 flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-4 h-4 text-emerald-600"></i> Subtemas del Módulo
                    </h4>
                    <div id="modal-subtopics-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="p-4 bg-slate-50 border-t border-emerald-100 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 rounded-xl font-bold text-sm bg-emerald-700 hover:bg-emerald-800 text-white transition-all">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Script de Funcionalidad -->
    <script>
        const roadmapData = [
            {
                id: "mod-1",
                category: "fundamentos",
                categoryLabel: "Fundamentos & Fonética",
                title: "1. Alfabeto Unificado y Reglas de Escritura",
                subtitle: "Achawaya y Normas Ortográficas Estandarizadas",
                level: "Nivel Inicial",
                estimatedTime: "2 Semanas",
                description: "Estudio exhaustivo del sistema fonético-gráfico oficial del Quechua Central.",
                subtopics: [
                    { id: "sub-1-1", quechua: "Achawaya unificado", spanish: "Alfabeto oficial unificado de 24 letras", completed: false },
                    { id: "sub-1-2", quechua: "Hanllakuna (a, i, u / aa, ii, uu)", spanish: "Vocales simples y alargamiento vocálico", completed: false }
                ]
            },
            {
                id: "mod-2",
                category: "comunicacion",
                categoryLabel: "Comunicación (Rimana)",
                title: "2. Gramática Básica y Sintaxis Oracional",
                subtitle: "Morfosintaxis aglutinante",
                level: "Nivel Básico",
                estimatedTime: "3 Semanas",
                description: "Comprensión del carácter aglutinante del quechua y estructura de oraciones.",
                subtopics: [
                    { id: "sub-2-1", quechua: "Awniq rimay", spanish: "Oración afirmativa (Estructura SOV)", completed: false },
                    { id: "sub-2-2", quechua: "Kamachikuq rimay", spanish: "Oración imperativa y de mandato", completed: false }
                ]
            },
            {
                id: "mod-3",
                category: "matematica",
                categoryLabel: "Matemática (Yupana)",
                title: "3. Sistema Numérico y Operaciones",
                subtitle: "Yupaykuna y Ruraykuna",
                level: "Nivel Básico",
                estimatedTime: "2 Semanas",
                description: "Estudio de los números cardinales y operaciones aritméticas básicas.",
                subtopics: [
                    { id: "sub-3-1", quechua: "Yupaykuna (1-100)", spanish: "Conteo y números cardinales", completed: false },
                    { id: "sub-3-2", quechua: "Yapay y Qichuy", spanish: "Suma y Resta en Quechua", completed: false }
                ]
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        function updateGlobalProgress() {
            let total = 0, completed = 0;
            roadmapData.forEach(mod => {
                mod.subtopics.forEach(sub => {
                    total++;
                    if (sub.completed) completed++;
                });
            });
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progress-text').innerText = `${completed} / ${total} Subtemas (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function renderRoadmap() {
            const container = document.getElementById('roadmap-container');
            container.innerHTML = '';

            const filtered = roadmapData.filter(mod => {
                const matchesFilter = currentFilter === 'all' || mod.category === currentFilter;
                const matchesSearch = searchQuery === '' || mod.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            filtered.forEach(mod => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 shadow-sm border border-emerald-100 flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold uppercase">${mod.categoryLabel}</span>
                        <h3 class="text-xl font-bold text-slate-900 mt-1">${mod.title}</h3>
                        <p class="text-xs text-slate-500">${mod.subtitle}</p>
                    </div>
                    <button onclick="openModal('${mod.id}')" class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-sm rounded-xl">Explorar</button>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(id) {
            const mod = roadmapData.find(m => m.id === id);
            if (!mod) return;
            document.getElementById('modal-category').innerText = mod.categoryLabel;
            document.getElementById('modal-title').innerText = mod.title;
            document.getElementById('modal-subtitle').innerText = mod.subtitle;
            document.getElementById('modal-description').innerText = mod.description;

            const list = document.getElementById('modal-subtopics-list');
            list.innerHTML = '';
            mod.subtopics.forEach(sub => {
                const item = document.createElement('div');
                item.className = "p-3 rounded-xl border border-slate-200 flex items-center justify-between";
                item.innerHTML = `<div><p class="font-bold text-sm">${sub.quechua}</p><p class="text-xs text-slate-500">${sub.spanish}</p></div>`;
                list.appendChild(item);
            });

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function filterPath(cat) {
            currentFilter = cat;
            renderRoadmap();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderRoadmap();
        }

        window.onload = () => {
            updateGlobalProgress();
            renderRoadmap();
        };
    </script>
</body>
</html>
